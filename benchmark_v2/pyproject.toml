[project]
name = "tabular-synthetic-data-benchmark-v2"
version = "0.1.0"
description = "Leakage-free, multi-seed benchmark of CTGAN and ctdGAN on ANSUR II"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ARTSyn==0.5.2",
  "ctgan==0.12.1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "sdmetrics==0.31.1",
  "xgboost>=3.0,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.13,<0.14"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
